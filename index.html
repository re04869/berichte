<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spielberichte</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            color: #333333;
            font-family: Arial, Helvetica, sans-serif;
        }

        .hinweis {
            width: min(90%, 500px);
            padding: 35px;
            box-sizing: border-box;
            text-align: center;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 28px;
        }

        p {
            margin: 0;
            font-size: 18px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main class="hinweis">
        <h1>Spielberichte</h1>
        <p>Leider stehen keine Spielberichte zur Verfügung.</p>
    </main>
</body>
</html>
